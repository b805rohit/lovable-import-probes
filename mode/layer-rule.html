<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mode layer rule</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #1f2937; background: #ffffff; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { margin: 0 0 10px; line-height: 1.5; }
    .card { border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    @layer alpha { .note { color: #b91c1c; font-weight: 700; } }
  </style>
</head>
<body>
  <div class="wrap" data-h="wrap">
    <h1 data-h="h1">One rule inside a layer</h1>
    <div class="card" data-h="card"><p class="note" data-h="note">Styled from @layer alpha.</p></div>
    <a data-h="back" href="./">Back</a>
  </div>
</body>
</html>
